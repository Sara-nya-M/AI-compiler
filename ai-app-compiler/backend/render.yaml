# Render deployment configuration
# Backend: render.yaml (place in root of backend folder when deploying to Render)

services:
  - type: web
    name: ai-app-compiler-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false   # set this in Render dashboard
